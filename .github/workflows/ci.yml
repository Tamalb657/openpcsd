name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e .[test]

      - name: Run tests
        run: pytest -v

      - name: Smoke-test the CLI
        run: |
          python examples/make_sample.py sample.pcsd
          python -m openpcsd inspect sample.pcsd
          python -m openpcsd thumbnail sample.pcsd -o thumb.png
          python examples/extract_texts.py sample.pcsd

      - name: Verify byte stability
        run: |
          python - <<'EOF'
          from openpcsd import read_pcsd, write_pcsd
          data = open("sample.pcsd", "rb").read()
          assert write_pcsd(read_pcsd(data)) == data, "round trip not byte-stable"
          print("byte stability: OK")
          EOF
